[PWM]
3=air_bubbler


[air_bubbler.config]
# Pump strength (percent, 0-100). Tune to produce modest bubbles. Burst/rest limits still apply.
duty_cycle=80
hertz=200
# seconds to stop bubbling before, and after, each OD reading
pre_delay_duration=2.5
post_delay_duration=0.5
enable_dodging_od=1

# Short bursts are the default. Timings require validation with your culture.
# seconds of bubbling per burst
burst_duration=1
# seconds of rest between bursts
rest_duration=27


[air_bubbler_continuous.config]
# Pump strength (percent, 0-100).
duty_cycle=80
hertz=200
# seconds to stop bubbling before, and after, each OD reading
pre_delay_duration=1.5
post_delay_duration=0.75
enable_dodging_od=1
