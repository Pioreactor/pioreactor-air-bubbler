[PWM]
3=air_bubbler


[air_bubbler.config]
# Tune pump strength to produce modest bubbles. Burst/rest limits still apply.
duty_cycle=80
hertz=200
pre_delay_duration=1.5
post_delay_duration=0.75
enable_dodging_od=1

# Short bursts are the default. Timings require validation with your culture.
burst_duration=1
rest_duration=30


[air_bubbler_continuous.config]
duty_cycle=80
hertz=200
pre_delay_duration=1.5
post_delay_duration=0.75
enable_dodging_od=1
